<style type="text/css">

    body{
        background-color: black;
        font-family: 'Orbitron', sans-serif;
    }

    #content{
        width: 100%;
        height: 100%;
    }

    .player{
        text-align: center;
        width: 60px;
        height: 100px;
        
        z-index: 20;
        
        position: absolute;
        color: black;
        font-size: 18px;
        
        text-shadow:
            -1px -1px 0 #000,
            1px -1px 0 #000,
            -1px 1px 0 #000,
            1px 1px 0 #000;
        
        color: lightgrey;
          -webkit-text-fill-color: lightgrey; /* Will override color (regardless of order) */
          -webkit-text-stroke-width: 1px;
          -webkit-text-stroke-color: lightgrey;
    }

    .player-name {
        display: block;
        max-width: 125px;
        overflow-wrap: normal;
        word-break: normal;
        margin: 0 auto 4px;
        padding: 2px 5px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.72);
        color: white;
        -webkit-text-fill-color: white;
        -webkit-text-stroke: 0;
        font-size: 13px;
        line-height: 1.2;
        position: relative;
        z-index: 21;
    }

    .player:hover{
        color: black;
          -webkit-text-fill-color: black; /* Will override color (regardless of order) */
          -webkit-text-stroke-width: 1px;
          -webkit-text-stroke-color: black;
    }

    .vote-button{
        margin-top: 5px;
        margin-left: 10px;
        width: 30px;
        background-color: grey;
        padding: 0px;
        border: 1px solid black;
    }
    .vote-button:first-of-type:hover{
        background-color: red;
    }
    
    #rocketlaunch{
        position: absolute;
        z-index: 2;
        
        width: 200px;
        height: 200px;
        top: 50px;
        left: 50px;
        
        text-align: center;
    }
    
    #rocketbutton:hover{
        transform: scale(1.3, 1.3);
    }
    
    #votes{
        text-align: center;
        font-size: 40px;
        
        position: absolute;
        top: 40px;
        right: 110px;
        
        color: white;
        
        z-index: 999;
        
          -webkit-text-fill-color: white; /* Will override color (regardless of order) */
          -webkit-text-stroke-width: 1px;
          -webkit-text-stroke-color: white;
    }

    body.race-started #votes {
        left: auto;
        right: 20px;
        top: 20px;
        width: min(32vw, 360px);
        max-width: calc(100vw - 40px);
        max-height: 32vh;
        overflow: auto;
        padding: 10px;
        box-sizing: border-box;
        background: transparent;
        text-align: right;
        font-size: clamp(16px, 2vw, 30px);
        -webkit-text-stroke-width: 0;
    }

    body.race-started #scores {
        font-size: clamp(13px, 1.5vw, 22px);
    }
    
    #backgroundimage{
        position: absolute;
        width: 100%;
        height: 100%;
    }
    
    #moon{
        z-index: 3;
        position: absolute;
        display: none;
        
        width: 10px;
        height: 10px;
        
        top: 30%;
        left: 30%;
    }
    
    #star{
        z-index: 1;
        position: absolute;
        display: none;
    }
    
    #camel{
        top: -100px;
        position: absolute;
        
        z-index: 998;
    }
    td { 
        padding-right: 20px;
    }
    
    #scores{
        font-size: 30px;
    }
    
    .smoke{
        position: absolute;
        top: 74px;
        left: -10px;
    }
    
    .victory{
        position: absolute;
        top: 15px;
        left: 76px;
    }

    .player.winner .rocketimg {
        width: 36px;
        height: auto;
    }


</style>


<script>
    //players = ["Avi", "Giacomo", "Alex", "Sherry", "Daniel", "Erol", "Vivian", "Juncheng", "Beagan", "Clara", "Sophia", "Eden", "Lauren", "Reid", "Sophie", "Jason", "Cole", "David", "Nhi", "Hannah", "Derek"]
    var players = []
    $.holdReady(true);
    $.getJSON("labmembers.php", function(data) {
        players = data
        players = players.sort()
        $.holdReady(false);
    });

    score = []
    totalVotes = 0
    var nextVotePoints = 2;
    
    var raceResults = [];
    
    var audioLaunch = new Audio('sounds/launch.mp3');
    var audioClaps = new Audio('sounds/moo.mp3');
    
    $( document ).ready(function() {
        
        distance = 100/(players.length+2);
        
        for(i=0; i<players.length; i++){
            score[i] = 0
            offset = (i%2)*30+80
            var $newplayer = $("<div>", {id: "player-" + i, "class": "player", css: {left: (distance * (i + 1)) + "%", bottom: offset + "px"}});
            $newplayer.append($("<span>", {"class": "player-name", text: players[i]}));
            $newplayer.append($("<img>", {"class": "rocketimg", id: "rocket" + i, src: "images/rocket_out.png", width: 55}));
            $newplayer.append($("<button>", {type: "button", "class": "vote-button btn btn-lg btn-block btn-outline-primary", text: "+2", click: (function(id) { return function() { addPoints(id); }; })(i)}));
            $("#content").append($newplayer);
        }
        
        startButton = "<div id=\"rocketlaunch\"><a href=\"javascript:launch()\"><img id=\"rocketbutton\" src=\"images/rocketlaunch.png\" width=180></a></div>"
        $("#content").append(startButton);
        
        votetext = "<div id=\"votes\"></div>"
        $("#content").append(votetext);
        
        addStars();
    });
    
    function addPoints(playerid){
        var points = nextVotePoints;
        score[playerid] += points
        totalVotes += points;
        nextVotePoints = points === 2 ? 1 : 2;
        $(".vote-button").text("+" + nextVotePoints);
        $("#votes").html("Votes<br>"+totalVotes);
    }
    
    function launch(){
        prepareRaceResults();
        $("body").addClass("race-started");
        $(".vote-button").fadeOut();
        $("#rocketlaunch").fadeOut();
        setTimeout(launch2, 200);

        $(".rocketimg").attr("src", "images/rocket.png");
    }
    
    function launch2(){
        $(".player").animate({height: "120%"}, 5000, "easeInQuint");
        setTimeout(launch3, 3000);
    }
    
    function launch3(){
        console.log("3");
        $("#backgroundimage").animate({top: "900px"}, 2000, "easeInSine");
        $("[id=star]").fadeIn();
        audioLaunch.play();
        setTimeout(launch4, 2000);
    }
    
    function prepareRaceResults(){
        raceResults = players.map(function(player, index) {
            return {player: player, score: Number(score[index]), index: index};
        });
        raceResults.sort(function(a, b) {
            return (b.score - a.score) || a.player.localeCompare(b.player);
        });

        var highestScore = raceResults.length ? raceResults[0].score : null;
        raceResults.forEach(function(result) {
            $("#player-" + result.index).toggleClass("winner", result.score === highestScore);
        });
    }

    function top3show(){
        prepareRaceResults();
        if (!raceResults.length) return;
        players.forEach(function(player, index) {
            var $player = $("#player-" + index);
            var currentTop = $player.position().top;
            $player.css({bottom: "auto", top: currentTop + "px"})
                .animate({top: "-260px"}, 3500, "easeInQuint");
        });
    }

    function winnerLandingPositions(winners, topOffset){
        var moonWidth = 600;
        var moonLeft = Math.max(0, Math.min(window.innerWidth * 0.30, window.innerWidth - moonWidth));
        var moonTop = window.innerHeight * 0.30;
        var cellWidth = Math.min(140, (moonWidth - 180) / Math.max(1, winners.length));
        var gridWidth = winners.length * cellWidth;
        var left = Math.max(moonLeft + 20, Math.min(moonLeft + (moonWidth - gridWidth) / 2 + 50, moonLeft + moonWidth - gridWidth - 20, window.innerWidth - gridWidth - 20));

        $("#moon").css({left: moonLeft + "px"});
        return winners.map(function(winner, index){
            return {
                winner: winner,
                left: left + index * cellWidth,
                top: moonTop + topOffset,
                cellWidth: cellWidth
            };
        });
    }
    
    function launch4(){
        console.log("4");
        $("#moon").fadeIn();
        $('#moon').animate({width: "600px",height: "600px"}, 14000)
        
        setTimeout(cameljump, 17000);
        setTimeout(launch6, 15000);
        setTimeout(top3show, 1000);
    }
    
    function cameljump(){
        
        
        $(".player.winner .rocketimg").each(function(){
            var $rocket = $(this);
            var smokeId = "smoke" + $rocket.attr("id").replace("rocket", "");
            $rocket.attr("src", "images/rocket_out.png");
            $rocket.parent().append($("<img>", {id: smokeId, "class": "smoke", src: "images/smoke.png", width: 80}));
            $("#" + smokeId).animate({opacity: 0, width: "200px", left: "-60px"}, 1000, "easeInOutBack");
        });
        
        var moonLeft = Math.max(0, Math.min(window.innerWidth * 0.30, window.innerWidth - 600));
        var moonTop = window.innerHeight * 0.30;
        $("#camel").css({top: (moonTop + 430) + "px", left: (moonLeft + 120) + "px"});
        $("#camel").animate({top: (moonTop + 415) + "px"}, 250, "easeOutCubic")
            .animate({top: (moonTop + 430) + "px"}, 250, "easeInCubic");
        //$("#camel").append("<img id=\"victory\" class=\"victory\" src=\"images/victory.png\" width=\"5\">");
        //$("#victory").animate({width: "36px"}, 500, "easeInOutBack");
        audioClaps.play();
    }
    
    function launch6(){
        
        console.log("launch6");
        var highestScore = raceResults.length ? raceResults[0].score : null;
        var winners = raceResults.filter(function(result) { return result.score === highestScore; });
        winnerLandingPositions(winners, 55).forEach(function(position) {
            $("#player-" + position.winner.index).css({top: "-260px", left: position.left + "px"})
                .animate({top: position.top + "px"}, 1500);
        });
        
        $("#moon").attr("src","images/moon2.png");
        
        finalScores = "Highscore<br>"
        
        finalScores += "<br><table id=\"scores\" style=\"border: none;\">";
        for(i=0; i<raceResults.length; i++){
            finalScores+="<tr><td>"+$('<div>').text(raceResults[i].player).html()+"</td><td>"+raceResults[i].score+"</td></tr>";
        }
        finalScores += "</table>";
        
        $("#votes").html(finalScores)
        $("#votes").css({textAlign: "right"})
        
        save();
    }
    
    function addStars(){
        for(i=0; i<100; i++){
            rtop = Math.round(Math.random()*900)
            rleft = Math.round(Math.random()*1700)
            
            rsize = Math.random()*10+2
            
            starstring = "<img id=\"star\" src=\"images/star.png\" style=\"top: "+rtop+"; left: "+rleft+"; width: "+rsize+"; height: "+rsize+";\">";
            $("#content").append(starstring);
        }
        
        $("#content").append("<img id=\"moon\" src=\"images/moon.png\">");
    }
    
    
    function getSortedKeys(obj) {
        var keys = []; for(var key in obj) keys.push(key);
        return keys.sort(function(a,b){return obj[b]-obj[a]});
    }
    
    function save(){
        
        var jscore = {}
        
        for(i=0; i< raceResults.length; i++){
            jscore[raceResults[i].player] = raceResults[i].score;
        }
        
        var str = JSON.stringify(jscore);
        
        $.get("support.php", {points:str}, function(data, status){
            //totalscore = data;
            
        });
    }
    
    function getScores(){
            
            $.get("https://amp.pharm.mssm.edu/camelrace/support.php", {userpoints:"gimme"}, function(data, status){
                scores = data;
                playernames = getSortedKeys(data);
                $("#content").html("");
                
                var temp = "<div id='result'><div id='finalscores'><table><tr><td>Name</td><td>Score</td><tr>";
                
                temp += "<tr id='winner'><td id='namefield'>"+playernames[0]+"</td><td>"+scores[playernames[0]]+"</td><tr>";
                for(j=1; j<playernames.length; j++){
                    temp += "<tr><td>"+playernames[j]+"</td><td>"+scores[playernames[j]]+"</td><tr>";
                }
                
                //$("#content").append(temp+"</div></div>");
                
            });
    }
    
</script>

<body>
    <div id="content">
        <img id="backgroundimage" src="images/hill.png">
    </div>
    
    <div id="camel"><img src="images/camel.png" width="110"></div>
</body>


</html>
