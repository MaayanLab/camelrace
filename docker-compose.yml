services:
  app:
    image: maayanlab/camelrace:1.4
    platform: linux/amd64
    build:
      context: .
      dockerfile: DockerfileCamel
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      dbserver: db
      dbuser: ${MYSQL_USER:-camelrace}
      dbpass: ${MYSQL_PASSWORD:-camelrace}
      dbname: ${MYSQL_DATABASE:-camelrace}
      LAB_MEMBERS: ${LAB_MEMBERS:-Alex,Sam,Jordan}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-camelrace}
      MYSQL_USER: ${MYSQL_USER:-camelrace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-camelrace}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/001-camelrace.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
